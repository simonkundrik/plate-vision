name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/pyproject.toml

      # CPU-only wheels from PyTorch's own index. The default PyPI torch wheel drags in
      # CUDA libraries the runner cannot use and turns a cold cache into gigabytes.
      - name: Install torch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      # The export extra is included so the PyTorch-versus-ONNX parity test gates every
      # PR. That test is the one that proves the graph the app runs matches the model the
      # metrics describe, which is not worth deferring to release time.
      - name: Install
        run: pip install -e ".[dev,train,export]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

      # The package reads its contract from a copy inside itself, because nothing above
      # site-packages is a repository. Checking here means a shared/ edit that was not
      # synced fails on the PR that made it rather than at publish time.
      - name: Check the packaged contract is current
        run: python scripts/sync_contract.py --check

      # packages/client/src/depth.ts is a hand-written mirror of platevision/depth.py, so
      # the app can normalise a depth map the way training did. Checking the fixture here
      # means an edit to the Python fails on the PR that made it, rather than surfacing as
      # a model quietly fed inputs it was never trained on.
      - name: Check the depth fixture is current
        run: python scripts/emit_depth_fixture.py --check

  node:
    # One install for the whole workspace rather than one per directory. The app depends on
    # packages/client through a workspace link, so installing them separately would check
    # the app against whatever was last published instead of the code in the PR.
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # Runs the client package's prepare script, so dist/ exists before anything
      # typechecks against it. dist/ is not committed.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The client package carries the drift test that compares its bundled copy of the
      # contract against shared/. Without this step that copy can go stale in a PR and the
      # only symptom is every prediction coming back under the wrong label.
      - name: Tests
        run: npm test

  contract:
    # The contract in shared/model_meta.json is consumed by Python, React Native, and the
    # browser. Validating it in its own job means a bad edit is attributed clearly rather
    # than surfacing as a confusing failure inside the Python test job.
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: python -c "import json,pathlib; json.loads(pathlib.Path('shared/model_meta.json').read_text())"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/pyproject.toml

      - name: Install
        working-directory: model
        run: pip install -e ".[dev]"

      - name: Validate contract semantics
        working-directory: model
        run: python -c "from platevision.meta import load_meta; load_meta(); print('contract OK')"
