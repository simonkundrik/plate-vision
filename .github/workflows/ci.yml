name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/pyproject.toml

      # CPU-only wheels from PyTorch's own index. The default PyPI torch wheel drags in
      # CUDA libraries the runner cannot use and turns a cold cache into gigabytes.
      - name: Install torch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      # The export extra is included so the PyTorch-versus-ONNX parity test gates every
      # PR. That test is the one that proves the graph the app runs matches the model the
      # metrics describe, which is not worth deferring to release time.
      - name: Install
        run: pip install -e ".[dev,train,export]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

  node:
    # app/ and web/ are scaffolded in PR #13 and PR #16. This job activates on its own
    # when a package.json appears, rather than being bolted on later and forgotten.
    name: node (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [app, web, packages/client]
    steps:
      - uses: actions/checkout@v4

      - name: Detect workspace
        id: detect
        run: |
          if [ -f "${{ matrix.workspace }}/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json in ${{ matrix.workspace }} yet, nothing to check."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ matrix.workspace }}
        run: npx tsc --noEmit

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ matrix.workspace }}
        run: npm run lint --if-present

      # The client package carries the drift test that compares its bundled copy of the
      # contract against shared/. Without this step that copy can go stale in a PR and the
      # only symptom is every prediction coming back under the wrong label.
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ matrix.workspace }}
        run: npm test --if-present

  contract:
    # The contract in shared/model_meta.json is consumed by Python, React Native, and the
    # browser. Validating it in its own job means a bad edit is attributed clearly rather
    # than surfacing as a confusing failure inside the Python test job.
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: python -c "import json,pathlib; json.loads(pathlib.Path('shared/model_meta.json').read_text())"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/pyproject.toml

      - name: Install
        working-directory: model
        run: pip install -e ".[dev]"

      - name: Validate contract semantics
        working-directory: model
        run: python -c "from platevision.meta import load_meta; load_meta(); print('contract OK')"
