[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platevision"
# Read from platevision/__init__.py so the version exists in exactly one place. Declaring it
# here as well is how a package ends up reporting 0.0.0 from __version__ while publishing
# 0.1.0 to an index.
dynamic = ["version"]
description = "On-device meal calorie estimation: training, evaluation, and ONNX export"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simon Kundrik" }]
keywords = ["pytorch", "onnx", "food", "nutrition", "quantile-regression", "on-device"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# Core stays deliberately small. Contract and data-layer tests must run in CI without
# pulling a multi-gigabyte torch wheel, so the heavy pieces live in extras below.
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
]

[project.urls]
Homepage = "https://github.com/simonkundrik/plate-vision"
Repository = "https://github.com/simonkundrik/plate-vision"
Issues = "https://github.com/simonkundrik/plate-vision/issues"
Demo = "https://simonkundrik.github.io/plate-vision/"

[project.optional-dependencies]
train = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0.11",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tqdm>=4.67",
]
export = [
    "onnx>=1.17",
    # Pinned to the same minor as onnxruntime-react-native so the exported artifact is
    # guaranteed to load on Android. See runtime.pin_rationale in shared/model_meta.json.
    "onnxruntime~=1.24.0",
    # Required by the dynamo ONNX exporter, which is the only path that can export
    # antialiased bilinear resize. See runtime.opset_rationale in shared/model_meta.json.
    "onnxscript>=0.1",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "platevision/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["platevision"]

# platevision/_data/ carries the contract, committed by scripts/sync_contract.py and checked
# against shared/ by pytest.
#
# It has to be inside the package. A published package cannot reference files outside
# itself, and without the copy `pip install platevision` produces a package whose every
# contract-touching function raises FileNotFoundError: nothing above site-packages is a
# repository, so there is no shared/ directory to find.
#
# Copying at build time via force-include was tried first and does not survive
# `pip install <sdist>`: the wheel is rebuilt from the extracted sdist, where `../shared`
# does not exist.

[tool.hatch.build.targets.sdist]
include = ["platevision", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are linted and formatted like everything else, because undefined names and
# unused imports matter just as much there. Two exceptions, both notebook idioms rather
# than defects: imports belong in the cell that needs them, and a one-line read of a
# results file does not warrant a context manager.
"notebooks/*.ipynb" = ["E402", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
